<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111b30"><title>Všeobecný rozhled | Moje encyklopedie</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182238;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#101a31,#284b74);color:white;padding:58px max(24px,calc((100vw - 1100px)/2)) 46px}header h1{font-size:clamp(2rem,5vw,3.8rem);margin:8px 0}header p{max-width:640px;line-height:1.6;color:#d9e7f7}.eyebrow{letter-spacing:.15em;text-transform:uppercase;font-size:.8rem;color:#a9d6ff}.container{max-width:1100px;margin:auto;padding:30px 20px}#search{width:100%;font:inherit;padding:15px 18px;border:1px solid #d1d9e8;border-radius:12px;margin:0 0 25px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:white;border:1px solid #e4e8f0;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #1822380a;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}.card:hover{transform:translateY(-2px);box-shadow:0 8px 25px #18223819}.card-image{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#dfeefa,#d7e4f8);font-size:64px}.card-body{padding:20px}.card h2{font-size:1.2rem;margin:0 0 10px}.card p{color:#53647c;line-height:1.5;margin:0}.meta{color:#61748d;font-size:.85rem;margin:0 0 12px}.back{border:0;background:none;color:#235fa3;font:inherit;cursor:pointer;padding:0 0 20px}.article{background:white;border:1px solid #e5eaf1;border-radius:18px;padding:clamp(22px,5vw,50px);max-width:850px;margin:auto}.article h1{font-size:clamp(2rem,4vw,3rem)}.article h2{margin-top:34px}.article p,.article li{line-height:1.8}.article .hero{height:260px;border-radius:14px;background:linear-gradient(120deg,#dce9f9,#f0f6fc);display:grid;place-items:center;font-size:90px}.figure{margin:22px 0;background:#f5f7fb;border-radius:12px;overflow:hidden}.figure img{display:block;width:100%;max-height:420px;object-fit:contain;background:#eef2f7}.figure figcaption{padding:10px 14px;font-size:.8rem;color:#526178}.figure a{color:#235fa3}.quiz{background:#f1f6ff;padding:20px;border-radius:12px;margin-top:30px}.quiz button{font:inherit;border:1px solid #bad0eb;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}.quiz .answer{display:none;margin-top:12px}footer{text-align:center;color:#697b91;padding:35px 15px;font-size:.85rem}.empty{color:#53647c}a{color:#235fa3}
</style></head><body><header><div class="eyebrow">Osobní knihovna poznání</div><h1>🌍 Všeobecný rozhled</h1><p>Světové dějiny, hudba, literatura, geografie a další témata. Krátké lekce, skutečné historické fotografie a kvízy pro zapamatování.</p></header><main class="container" id="app"></main><footer>Všeobecný rozhled · Obrazové materiály: Wikimedia Commons, licence a autoři jsou uvedeni u jednotlivých snímků.</footer><script src="lessons.js"></script><script>
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){history.replaceState(null,'','#');app.innerHTML='<input id="search" type="search" placeholder="Hledat v lekcích, osobnostech a tématech…" aria-label="Hledat"><div class="grid" id="grid"></div>';const input=document.getElementById('search');input.addEventListener('input',()=>cards(input.value));cards('')}
function cards(q){const matches=LESSONS.filter(l=>[l.title,l.intro,...l.sections.map(s=>s.title+' '+s.text)].join(' ').toLocaleLowerCase('cs').includes(q.toLocaleLowerCase('cs')));document.getElementById('grid').innerHTML=matches.map(l=>`<button class="card" data-id="${esc(l.id)}"><div class="card-image">${l.emoji}</div><div class="card-body"><div class="meta">${esc(l.category)} · ${l.sections.length} témat</div><h2>${esc(l.title)}</h2><p>${esc(l.intro)}</p></div></button>`).join('')||'<p class="empty">Žádná odpovídající lekce.</p>';document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id})}
function article(id){const l=LESSONS.find(x=>x.id===id);if(!l){home();return}app.innerHTML=`<div class="article"><button class="back" id="back">← Všechny lekce</button><div class="meta">${esc(l.category)}</div><h1>${l.emoji} ${esc(l.title)}</h1><p>${esc(l.intro)}</p><div class="hero" aria-hidden="true">${l.emoji}</div>${l.sections.map((s,i)=>`<section><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p>${s.image?`<figure class="figure" data-query="${esc(s.image)}"><div class="meta" style="padding:18px">Načítám autentický obrázek z Wikimedia Commons…</div></figure>`:''}${s.extra?`<p><strong>Zapamatuj si:</strong> ${esc(s.extra)}</p>`:''}</section>`).join('')}<div class="quiz"><h2>🧠 Krátký kvíz</h2><p>${esc(l.quiz.q)}</p><button id="reveal">Ukázat odpověď</button><p class="answer" id="answer">${esc(l.quiz.a)}</p></div></div>`;document.getElementById('back').onclick=()=>location.hash='';document.getElementById('reveal').onclick=()=>document.getElementById('answer').style.display='block';document.querySelectorAll('.figure').forEach(loadImage)}
async function loadImage(el){const query=el.dataset.query;const params=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+query,gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'760',format:'json',origin:'*'});try{const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params);if(!response.ok)throw Error('API');const data=await response.json();const pages=Object.values(data.query?.pages||{});const candidates=pages.filter(p=>p.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png)$/i.test(p.title));const p=candidates[0];if(!p)throw Error('Nenalezen obrázek');const info=p.imageinfo[0];const safeUrl=u=>/^https:\/\//.test(u)?u:'';const src=safeUrl(info.thumburl),page=safeUrl(info.descriptionurl);if(!src)throw Error('URL');el.innerHTML=`<img loading="lazy" alt="${esc(p.title.replace(/^File:/,''))}" src="${esc(src)}"><figcaption>Skutečný obrazový materiál z <a target="_blank" rel="noopener noreferrer" href="${esc(page)}">Wikimedia Commons – zdroj a licence</a>. Automatický výběr je vhodné redakčně zkontrolovat.</figcaption>`}catch(e){el.innerHTML=`<figcaption>Obrázek se nepodařilo načíst. <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(query)}&title=Special:MediaSearch&type=image">Prohlédnout obrázky na Wikimedia Commons</a>.</figcaption>`}}
function route(){const id=decodeURIComponent(location.hash.slice(1));if(id)article(id);else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
